[mypy]
python_version = 3.8
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = silent
strict_optional = false
no_implicit_optional = false
# Disable most error checking for now
disable_error_code = attr-defined,assignment,operator,index,no-redef,return-value,var-annotated,unused-coroutine,arg-type,valid-type